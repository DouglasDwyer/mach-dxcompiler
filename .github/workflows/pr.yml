name: PR
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**.md"
jobs:
  # TEMPORARY (PR #7): only aarch64-windows-msvc (Debug) runs while iterating on it; restore the other targets, ReleaseFast and the x86_64 -Dcpu include before merge.
  msvc:
    # TODO: re-enable required MSVC builds
    continue-on-error: true
    strategy:
      matrix:
        target: [
          'aarch64-windows-msvc',
        ]
        optimize: [Debug]
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Setup Zig
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri "https://pkg.machengine.org/zig/zig-windows-x86_64-0.14.0-dev.1911+3bf89f55c.zip" -OutFile "C:\zig.zip"
          cd C:\
          7z x zig.zip
          Add-Content $env:GITHUB_PATH "C:\zig-windows-x86_64-0.14.0-dev.1911+3bf89f55c\"
      - name: build
        run: zig build -Dfrom_source -Dtarget=${{ matrix.target }} -Doptimize=${{ matrix.optimize }} install dxc
